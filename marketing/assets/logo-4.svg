<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 250" width="250" height="250">
  <!-- Golden Circle Background -->
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd166;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffb347;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <circle cx="125" cy="125" r="120" fill="url(#goldGrad)"/>
  <circle cx="125" cy="125" r="110" fill="#2c1d27"/>
  
  <!-- Cards Fan -->
  <g transform="translate(125, 100)">
    <rect x="-40" y="-30" width="30" height="50" rx="3" fill="#e74c3c" stroke="#ffd166" stroke-width="2" 
          transform="rotate(-20)"/>
    <rect x="-15" y="-30" width="30" height="50" rx="3" fill="#3498db" stroke="#ffd166" stroke-width="2"/>
    <rect x="10" y="-30" width="30" height="50" rx="3" fill="#2ecc71" stroke="#ffd166" stroke-width="2" 
          transform="rotate(20)"/>
  </g>
  
  <!-- Center Boar -->
  <text x="125" y="145" font-size="60" text-anchor="middle" fill="#ffd166">🐗</text>
  
  <!-- Brand Arc -->
  <path id="textPath" d="M 60,200 A 90,90 0 0,1 190,200" fill="none"/>
  <text font-family="Comic Neue, Arial, sans-serif" font-size="22" font-weight="bold" fill="#ffd166">
    <textPath href="#textPath" text-anchor="middle" startOffset="50%">SUPERBOAR GAMES</textPath>
  </text>
</svg>