<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 100" width="300" height="100">
  <!-- Card Shape -->
  <rect x="10" y="10" width="80" height="80" rx="10" fill="#ffd166" stroke="#2c1d27" stroke-width="3"/>
  <rect x="15" y="15" width="70" height="70" rx="8" fill="#2c1d27"/>
  
  <!-- Card Content -->
  <text x="50" y="60" font-size="40" text-anchor="middle" fill="#ffd166">🐗</text>
  <text x="50" y="80" font-family="Comic Neue, Arial, sans-serif" font-size="10" 
        text-anchor="middle" fill="#ffd166">TFI</text>
  
  <!-- Brand Text -->
  <text x="110" y="45" font-family="Comic Neue, Arial, sans-serif" font-size="36" 
        font-weight="bold" fill="#2c1d27">Boar</text>
  <text x="110" y="75" font-family="Comic Neue, Arial, sans-serif" font-size="36" 
        font-weight="bold" fill="#2c1d27">Park</text>
  
  <!-- Decorative Element -->
  <circle cx="260" cy="50" r="20" fill="#2c1d27"/>
  <text x="260" y="58" font-size="24" text-anchor="middle" fill="#ffd166">🎴</text>
</svg>