version: '3.8'

services:
  marketing:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: boar-park-marketing
    ports:
      - "8080:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - boar-park-network

  # Metrics/monitoring (optional)
  # prometheus:
  #   image: prom/prometheus:latest
  #   container_name: prometheus
  #   ports:
  #     - "9090:9090"
  #   volumes:
  #     - ./prometheus.yml:/etc/prometheus/prometheus.yml
  #   networks:
  #     - boar-park-network

networks:
  boar-park-network:
    driver: bridge