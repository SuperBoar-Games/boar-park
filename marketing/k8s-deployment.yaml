apiVersion: apps/v1
kind: Deployment
metadata:
  name: boar-park-marketing
  namespace: default
  labels:
    app: boar-park-marketing
spec:
  replicas: 2
  selector:
    matchLabels:
      app: boar-park-marketing
  template:
    metadata:
      labels:
        app: boar-park-marketing
    spec:
      containers:
      - name: marketing
        image: boar-park-marketing:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 80
          protocol: TCP
        resources:
          requests:
            memory: "32Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: boar-park-marketing
  namespace: default
spec:
  selector:
    app: boar-park-marketing
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30080
  type: NodePort
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: boar-park-marketing
  namespace: default
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
  - host: boar-park.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: boar-park-marketing
            port:
              number: 80
---