name: Deploy to Production

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - closed
    branches:
      - main

jobs:
  deploy:
    # For PRs: only run when actually merged (not just closed)
    if: github.event_name == 'push' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            sudo /var/www/boar-park/deployment/deploy.sh production main 2>&1
          script_stop: true

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Deployment failed. Check the VPS logs: journalctl -u boar-park -n 50"
