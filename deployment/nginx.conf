# Nginx configuration for Boar Park
# Place in /etc/nginx/sites-available/boar-park and symlink to sites-enabled

server {
    listen 80;
    listen [::]:80;
    server_name superboar.com www.superboar.com;

    # Logging
    access_log /var/log/nginx/boar-park-access.log combined;
    error_log /var/log/nginx/boar-park-error.log warn;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

    # Allow large file uploads (design files, print exports can be big)
    client_max_body_size 100M;

    # Root
    root /var/www/boar-park/dist/client;

    # API proxy to backend
    location /api/ {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # SSE (Server-Sent Events) — disable buffering for real-time streaming
        proxy_buffering off;
        proxy_cache off;
    }

    # SSE endpoint — long-lived connections need extended timeout
    # Force HTTP/1.1 by suppressing Alt-Svc (prevents browser QUIC upgrade which breaks SSE)
    location /api/events {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
        add_header Alt-Svc 'clear' always;
        add_header Cache-Control 'no-cache' always;
    }

    # Health check endpoint
    location /health {
        proxy_pass http://localhost:3000;
        access_log off;
    }

    # Service worker — must never be cached
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
    }

    # Manifest
    location = /manifest.json {
        add_header Cache-Control "no-cache";
    }

    # Icons — short cache so updates are picked up quickly
    location /icons/ {
        expires 1d;
        add_header Cache-Control "public, must-revalidate";
    }

    # Uploaded card files.
    #
    # `internal` — nginx serves this only in response to an X-Accel-Redirect
    # from the backend; a direct request gets 404. The app validates a signed,
    # expiring URL and then hands the path back here, so nginx still streams
    # the bytes with range support but never without authorisation.
    #
    # ^~ keeps the regex static-file block below from matching /media/ paths.
    location ^~ /media/ {
        internal;
        alias /var/www/boar-park/media/;
        # private: these are per-user authorised, never shared caches
        add_header Cache-Control "private, max-age=3600";
    }

    # Static files (React app) — long cache since filenames are hashed
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html — never cache. It references the hashed JS/CSS bundles, so it
    # must always revalidate; a stale index.html would keep pointing browsers at
    # old asset hashes and swallow deploys until a hard refresh.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # React router - serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
    }
}
